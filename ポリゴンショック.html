<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>ローカルテスト用（点滅注意）</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      /* アニメーションを適用：0.1秒周期で無限に繰り返す */
      animation: polygon-shock 0.02s infinite steps(1);
    }

    /* 赤と青を高速で切り替えるキーフレーム設定 */
    @keyframes polygon-shock {
      0% {
        background-color: #ff0000;
      }
      25% {
        background-color: #0000ff;
      }
      50% {
        background-color: #00ff00;
      }
      75% {
        background-color: #000000;
      }
      100% {
        background-color: #ffffff;
      }
    }

    /* （参考）以前のpタグの設定を維持する場合 */
    p {
      white-space: pre-line;
      color: #fff;
      font-size: 24px;
      font-weight: bold;
      text-align: center;
      padding-top: 40vh;
      text-shadow: 0 0 10px #000; /* 背景が激しいので文字に影をつけています */
    }
  </style>
</head>
<body>

  <p>【警告】画面の高速点滅に注意してください。
  （pre-lineによる改行は維持れています）</p>

</body>
</html>
