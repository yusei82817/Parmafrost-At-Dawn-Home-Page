<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="620" viewBox="0 0 1600 620" role="img" aria-labelledby="title desc">
  <title id="title">Hundred Flowers In Abundance</title>
  <desc id="desc">Futuristic game title logo with cyan, blue, violet and magenta accents, a circular HUD emblem, and cherry blossom petals. Transparent background.</desc>
  <defs>
    <linearGradient id="titleFill" x1="0" y1="0" x2="0.15" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".28" stop-color="#d9f8ff"/>
      <stop offset=".55" stop-color="#69d9ff"/>
      <stop offset=".78" stop-color="#6a72ff"/>
      <stop offset="1" stop-color="#e6c7ff"/>
    </linearGradient>
    <linearGradient id="subFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".5" stop-color="#c5dfff"/>
      <stop offset="1" stop-color="#b98cff"/>
    </linearGradient>
    <linearGradient id="lineFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00e5ff"/>
      <stop offset=".52" stop-color="#6b73ff"/>
      <stop offset="1" stop-color="#ff64d5"/>
    </linearGradient>
    <linearGradient id="plateFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101b45" stop-opacity=".96"/>
      <stop offset=".5" stop-color="#071027" stop-opacity=".97"/>
      <stop offset="1" stop-color="#261344" stop-opacity=".96"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-40%" width="160%" height="180%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <g id="petal">
      <path d="M0 0 C-20 -13 -18 -37 0 -48 C18 -35 21 -13 0 0Z" fill="#ff9cde" fill-opacity=".92" stroke="#ffd6f4" stroke-width="2"/>
      <path d="M0 -7 Q2 -24 0 -39" fill="none" stroke="#fff0fb" stroke-width="1.6" opacity=".8"/>
    </g>
    <g id="tick">
      <path d="M0 0 H54 L66 10 H12Z" fill="url(#lineFill)"/>
      <path d="M18 18 H48" stroke="#c8f8ff" stroke-width="2" opacity=".85"/>
    </g>
  </defs>

  <!-- Outer HUD frame -->
  <g fill="none" stroke="url(#lineFill)" stroke-width="3" opacity=".95">
    <path d="M72 238 H250 L282 210 H470"/>
    <path d="M1528 238 H1350 L1318 210 H1130"/>

    <use href="#tick" x="300" y="406"/>
    <use href="#tick" x="1240" y="406" transform="translate(2480 0) scale(-1 1)"/>
  </g>

  <!-- Broken circular insignia -->
  <g transform="translate(800 310)" fill="none" stroke-linecap="round">
    <circle r="224" stroke="#3c4bff" stroke-width="3" stroke-dasharray="150 25 52 25 110 40" opacity=".82"/>

  <path d="M1555 266 L1344 266 L1300 246 H1160 L1194 270 H1282 L1318 291 H1528Z" fill="url(#plateFill)" stroke="url(#lineFill)" stroke-width="3"/>

    <use href="#petal" transform="translate(988 493) rotate(20) scale(.48)"/>

  <!-- Title typography: editable text objects -->
  <g font-family="Arial, Helvetica, sans-serif" font-weight="900" font-style="italic" text-anchor="middle" paint-order="stroke fill">
    <text x="800" y="286" font-size="101" letter-spacing="2.5" fill="#03091e" stroke="#03091e" stroke-width="17">Hundred Flowers</text>
    <text x="800" y="286" font-size="101" letter-spacing="2.5" fill="url(#titleFill)" stroke="#eafaff" stroke-width="2.2">Hundred Flowers</text>
    <text x="800" y="363" font-size="77" letter-spacing="5" fill="#03091e" stroke="#03091e" stroke-width="15">In Abundance</text>
    <text x="800" y="363" font-size="77" letter-spacing="5" fill="url(#subFill)" stroke="#eafaff" stroke-width="2">In Abundance</text>
  </g>

  <!-- Blossom glyph in a small hexagonal badge -->
  <g transform="translate(800 421)">
